<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫공 - AI 공부 플래너</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #121214;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #root {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // 브라우저 저장소 호환 폴리필 (GitHub Pages용)
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const val = localStorage.getItem(key);
            return val ? { value: val } : null;
          } catch (e) { return null; }
        },
        set: async (key, value) => {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch (e) { return false; }
        }
      };
    }

    // SVG 아이콘 컴포넌트
    const Icon = ({ path, size = 18, className = "", style = {}, onClick }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style} onClick={onClick}>
        {path}
      </svg>
    );

    const Home = (p) => <Icon {...p} path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />;
    const CalendarClock = (p) => <Icon {...p} path={<><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><circle cx="16" cy="16" r="6"/><polyline points="16 14 16 16 18 16"/></>} />;
    const TimerIcon = (p) => <Icon {...p} path={<><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="12" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></>} />;
    const Camera = (p) => <Icon {...p} path={<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>} />;
    const BrainCircuit = (p) => <Icon {...p} path={<><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M12 13h.01"/></>} />;
    const Play = (p) => <Icon {...p} path={<polygon points="6 3 20 12 6 21 6 3"/>} />;
    const Pause = (p) => <Icon {...p} path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} />;
    const RotateCcw = (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />;
    const X = (p) => <Icon {...p} path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />;
    const Loader2 = (p) => <Icon {...p} path={<path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/>} />;
    const Sparkles = (p) => <Icon {...p} path={<path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28z"/>} />;
    const TrendingUp = (p) => <Icon {...p} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />;
    const Upload = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>} />;
    const CheckCircle2 = (p) => <Icon {...p} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />;
    const XCircle = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>} />;
    const Trash2 = (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>} />;
    const BookOpen = (p) => <Icon {...p} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />;

    const ACCENTS = ["#E8A33D", "#7FB3B0", "#E0704F", "#A78BC7", "#8FAF7A"];
    const STORAGE_KEY = "cheotgong-app-data";

    function uid() { return Math.random().toString(36).slice(2, 10); }
    function pad2(n) { return String(n).padStart(2, "0"); }
    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      if (h > 0) return `${h}:${pad2(m)}:${pad2(s)}`;
      return `${pad2(m)}:${pad2(s)}`;
    }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(",")[1]);
        r.onerror = () => reject(new Error("파일을 읽지 못했어요"));
        r.readAsDataURL(file);
      });
    }
    function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    async function callClaude({ system, userContent, maxTokens = 1000 }, attempt = 1) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: maxTokens,
          system,
          messages: [{ role: "user", content: userContent }],
        }),
      });
      if (!res.ok) {
        const transient = [408, 425, 500, 502, 503, 504].includes(res.status);
        if (transient && attempt < 2) {
          await sleep(1200);
          return callClaude({ system, userContent, maxTokens }, attempt + 1);
        }
        let detail = "";
        try { detail = (await res.text()).slice(0, 200); } catch (e) {}
        throw new Error(`API 요청 실패 (${res.status}) ${detail}`);
      }
      const data = await res.json();
      const text = (data.content || [])
        .map((b) => (b.type === "text" ? b.text : ""))
        .filter(Boolean)
        .join("\n");
      if (!text) throw new Error("응답 내용이 비어있어요");
      return text;
    }

    function parseJsonLoose(text) {
      const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
      const start = cleaned.indexOf("{");
      const end = cleaned.lastIndexOf("}");
      const slice = start >= 0 && end >= 0 ? cleaned.slice(start, end + 1) : cleaned;
      return JSON.parse(slice);
    }

    function StudyApp() {
      const [tab, setTab] = useState("home");
      const [loaded, setLoaded] = useState(false);
      const [loadFailed, setLoadFailed] = useState(false);
      const [saveError, setSaveError] = useState(false);

      const [subjects, setSubjects] = useState([]);
      const [studyInput, setStudyInput] = useState("");
      const [goal, setGoal] = useState("");
      const [dailyHoursTarget, setDailyHoursTarget] = useState(3);
      const [beginner, setBeginner] = useState(true);
      const [plan, setPlan] = useState(null);
      const [records, setRecords] = useState([]);
      const [quizSets, setQuizSets] = useState([]);
      const [bookRecs, setBookRecs] = useState([]);

      useEffect(() => {
        let cancelled = false;
        async function attemptLoad(retriesLeft) {
          try {
            const result = await window.storage.get(STORAGE_KEY);
            if (cancelled) return;
            if (result && result.value) {
              const d = JSON.parse(result.value);
              setSubjects(d.subjects || []);
              setStudyInput(d.studyInput || "");
              setGoal(d.goal || "");
              setDailyHoursTarget(d.dailyHoursTarget ?? 3);
              setBeginner(d.beginner ?? true);
              setPlan(d.plan || null);
              setRecords(d.records || []);
              setQuizSets(d.quizSets || []);
              setBookRecs(d.bookRecs || []);
            }
            setLoaded(true);
          } catch (e) {
            if (retriesLeft > 0) {
              setTimeout(() => attemptLoad(retriesLeft - 1), 600);
            } else {
              setLoadFailed(true);
              setLoaded(true);
            }
          }
        }
        attemptLoad(2);
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!loaded) return;
        const payload = { subjects, studyInput, goal, dailyHoursTarget, beginner, plan, records, quizSets, bookRecs };
        const isEmptyPayload = subjects.length === 0 && !studyInput && !goal && !plan && records.length === 0 && quizSets.length === 0 && bookRecs.length === 0;
        if (loadFailed && isEmptyPayload) return;
        (async () => {
          try {
            const r = await window.storage.set(STORAGE_KEY, JSON.stringify(payload));
            setSaveError(!r);
          } catch (e) { setSaveError(true); }
        })();
      }, [subjects, studyInput, goal, dailyHoursTarget, beginner, plan, records, quizSets, bookRecs, loaded, loadFailed]);

      const addRecord = useCallback((subjectName, minutes) => {
        setRecords((prev) => [
          ...prev,
          { id: uid(), subject: subjectName, minutes, date: todayStr(), ts: Date.now() },
        ]);
      }, []);

      const todayMinutes = records.filter((r) => r.date === todayStr()).reduce((sum, r) => sum + r.minutes, 0);

      return (
        <div className="app-root">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Pen+Script&display=swap');
            .app-root {
              --bg: #1F3B34; --surface: #2A4A41; --surface-light: #35594F; --ink: #F1EDE3; --ink-muted: #A8BEB6; --amber: #E8A33D; --blue: #7FB3B0; --coral: #E0704F; --line: rgba(241,237,227,0.14);
              font-family: 'IBM Plex Sans KR', sans-serif; background: var(--bg); color: var(--ink);
              min-height: 600px; max-width: 480px; margin: 0 auto; border-radius: 20px; overflow: hidden;
              display: flex; flex-direction: column; position: relative;
            }
            .display-font { font-family: 'Gowun Batang', serif; }
            .pen-font { font-family: 'Nanum Pen Script', cursive; }
            .mono-font { font-family: 'IBM Plex Mono', monospace; }
            .header { padding: 22px 20px 16px; border-bottom: 1px dashed var(--line); display: flex; align-items: baseline; justify-content: space-between; }
            .header h1 { font-size: 22px; margin: 0; }
            .header .date { font-size: 12px; color: var(--ink-muted); }
            .content { flex: 1; overflow-y: auto; padding: 18px 18px 90px; }
            .card { background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
            .card-title { font-size: 13px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
            .btn { border: none; border-radius: 10px; padding: 11px 16px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; transition: transform 0.12s ease, opacity 0.12s ease; }
            .btn:active { transform: scale(0.97); }
            .btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .btn-primary { background: var(--amber); color: #1F3B34; }
            .btn-secondary { background: var(--surface-light); color: var(--ink); }
            .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--line); }
            .btn-block { width: 100%; }
            input[type="text"], input[type="number"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; box-sizing: border-box; }
            textarea { resize: vertical; min-height: 60px; }
            input::placeholder, textarea::placeholder { color: var(--ink-muted); }
            .tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #1F3B34; }
            .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
            .nav-btn { flex: 1; background: none; border: none; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
            .nav-btn.active { color: var(--amber); background: rgba(232,163,61,0.12); }
            .plan-block { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); }
            .plan-block:last-child { border-bottom: none; }
            .ring-wrap { display:flex; align-items:center; justify-content:center; margin: 6px 0 16px; }
            .quiz-option { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); margin-bottom: 8px; cursor: pointer; font-size: 14px; }
            .quiz-option.correct { border-color: #8FAF7A; background: rgba(143,175,122,0.15); }
            .quiz-option.wrong { border-color: var(--coral); background: rgba(224,112,79,0.15); }
            .empty { text-align: center; padding: 30px 10px; color: var(--ink-muted); font-size: 13px; }
            .photo-upload { border: 1px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; color: var(--ink-muted); font-size: 13px; display: block; }
            img.preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display:block; }
            .spin { animation: spin-rotate 0.9s linear infinite; }
            @keyframes spin-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          `}</style>

          <div className="header">
            <h1 className="display-font">첫공 플래너</h1>
            <div style={{ textAlign: "right" }}>
              <span className="date mono-font">{todayStr()}</span>
              {saveError && <div style={{ fontSize: 10, color: "var(--coral)", marginTop: 2 }}>저장 실패</div>}
            </div>
          </div>

          <div className="content">
            {tab === "home" && <HomeTab subjects={subjects} goal={goal} dailyHoursTarget={dailyHoursTarget} todayMinutes={todayMinutes} records={records} plan={plan} goToPlan={() => setTab("plan")} goToTimer={() => setTab("timer")} />}
            {tab === "plan" && <PlanTab subjects={subjects} setSubjects={setSubjects} studyInput={studyInput} setStudyInput={setStudyInput} goal={goal} setGoal={setGoal} dailyHoursTarget={dailyHoursTarget} setDailyHoursTarget={setDailyHoursTarget} beginner={beginner} setBeginner={setBeginner} plan={plan} setPlan={setPlan} />}
            {tab === "timer" && <TimerTab subjects={subjects} plan={plan} onFinishSession={addRecord} records={records} />}
            {tab === "photo" && <PhotoSolveTab />}
            {tab === "quiz" && <QuizTab quizSets={quizSets} setQuizSets={setQuizSets} />}
            {tab === "books" && <BookRecommendTab bookRecs={bookRecs} setBookRecs={setBookRecs} />}
          </div>

          <div className="bottom-nav">
            <NavBtn icon={Home} label="홈" active={tab === "home"} onClick={() => setTab("home")} />
            <NavBtn icon={CalendarClock} label="계획" active={tab === "plan"} onClick={() => setTab("plan")} />
            <NavBtn icon={TimerIcon} label="타이머" active={tab === "timer"} onClick={() => setTab("timer")} />
            <NavBtn icon={Camera} label="문제풀이" active={tab === "photo"} onClick={() => setTab("photo")} />
            <NavBtn icon={BrainCircuit} label="퀴즈" active={tab === "quiz"} onClick={() => setTab("quiz")} />
            <NavBtn icon={BookOpen} label="책추천" active={tab === "books"} onClick={() => setTab("books")} />
          </div>
        </div>
      );
    }

    function NavBtn({ icon: Icon, label, active, onClick }) {
      return (
        <button className={`nav-btn ${active ? "active" : ""}`} onClick={onClick}>
          <Icon size={18} />
          <span>{label}</span>
        </button>
      );
    }

    function HomeTab({ subjects, goal, dailyHoursTarget, todayMinutes, records, plan, goToPlan, goToTimer }) {
      const [comparing, setComparing] = useState(false);
      const [comparison, setComparison] = useState(null);
      const [error, setError] = useState("");

      const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
      const weekMinutes = records.filter((r) => r.ts >= weekAgo).reduce((s, r) => s + r.minutes, 0);

      async function runComparison() {
        setComparing(true); setError(""); setComparison(null);
        try {
          const system = '너는 학습 코치야. 사용자의 목표와 최근 공부 시간을 보고, 그 목표를 가진 일반적인 학습자들이 보통 하루에 얼마나 공부하는지 참고 범위를 알려주고, 사용자가 그 범위 대비 적은지/적정한지/많은지 짧게 평가해줘. 반드시 순수 JSON만 출력해. 형식: {"level":"부족|적정|많음|과함 중 하나","message":"두 문장 이내의 한국어 코멘트","referenceRange":"예: 하루 2~4시간"}';
          const userContent = `목표: ${goal || "미설정"}\n하루 목표 공부시간: ${dailyHoursTarget}시간\n오늘 실제 공부시간: ${(todayMinutes / 60).toFixed(1)}시간\n최근 7일 총 공부시간: ${(weekMinutes / 60).toFixed(1)}시간`;
          const text = await callClaude({ system, userContent, maxTokens: 400 });
          setComparison(parseJsonLoose(text));
        } catch (e) {
          setError("비교 결과를 가져오지 못했어요.");
        } finally { setComparing(false); }
      }

      return (
        <div>
          <div className="card">
            <p className="card-title"><TrendingUp size={14} /> 오늘의 공부 시간</p>
            <div style={{ fontSize: 32, fontWeight: 700 }} className="mono-font">
              {(todayMinutes / 60).toFixed(1)}<span style={{ fontSize: 16, color: "var(--ink-muted)" }}> / {dailyHoursTarget}시간</span>
            </div>
            <div style={{ height: 8, background: "var(--bg)", borderRadius: 999, marginTop: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${Math.min(100, (todayMinutes / 60 / dailyHoursTarget) * 100)}%`, background: "var(--amber)", borderRadius: 999 }} />
            </div>
          </div>

          {!plan ? (
            <div className="card">
              <p className="card-title"><Sparkles size={14} /> 오늘의 계획이 아직 없어요</p>
              <p style={{ fontSize: 13, color: "var(--ink-muted)", marginTop: 0 }}>과목과 목표를 입력하면 AI가 하루 계획을 짜드려요.</p>
              <button className="btn btn-primary btn-block" onClick={goToPlan}>계획 짜러 가기</button>
            </div>
          ) : (
            <div className="card">
              <p className="card-title"><CalendarClock size={14} /> 오늘의 계획</p>
              {plan.blocks.map((b, i) => (
                <div className="plan-block" key={i}>
                  <span className="tag" style={{ background: b.type === "break" ? "var(--blue)" : ACCENTS[i % ACCENTS.length] }}>
                    {b.type === "break" ? "휴식" : b.subject}
                  </span>
                  <span style={{ fontSize: 13, color: "var(--ink-muted)" }}>{b.minutes}분</span>
                </div>
              ))}
              <button className="btn btn-secondary btn-block" style={{ marginTop: 10 }} onClick={goToTimer}>타이머로 시작하기</button>
            </div>
          )}

          <div className="card">
            <p className="card-title"><TrendingUp size={14} /> 다른 학습자와 비교</p>
            <p style={{ fontSize: 12, color: "var(--ink-muted)", marginTop: 0 }}>* 목표에 맞는 일반적인 권장 범위를 기준으로 한 AI 추정치예요.</p>
            {comparison && (
              <div style={{ marginTop: 8 }}>
                <span className="tag" style={{ background: "var(--amber)" }}>{comparison.level}</span>
                <p style={{ fontSize: 14, margin: "8px 0 4px" }}>{comparison.message}</p>
                <p style={{ fontSize: 12, color: "var(--ink-muted)" }}>참고 범위: {comparison.referenceRange}</p>
              </div>
            )}
            {error && <p style={{ fontSize: 13, color: "var(--coral)" }}>{error}</p>}
            <button className="btn btn-ghost btn-block" onClick={runComparison} disabled={comparing}>
              {comparing ? <Loader2 size={14} className="spin" /> : <TrendingUp size={14} />}
              {comparing ? "분석 중..." : "지금 비교해보기"}
            </button>
          </div>
        </div>
      );
    }

    function PlanTab({ subjects, setSubjects, goal, setGoal, dailyHoursTarget, setDailyHoursTarget, beginner, setBeginner, plan, setPlan, studyInput, setStudyInput }) {
      const [parsedSubjects, setParsedSubjects] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [analyzeError, setAnalyzeError] = useState("");
      const [building, setBuilding] = useState(false);
      const [buildError, setBuildError] = useState("");

      async function analyzeSubjects() {
        if (!studyInput.trim()) { setAnalyzeError("지금 하고 있는 공부를 적어 주세요."); return; }
        setAnalyzing(true); setAnalyzeError(""); setParsedSubjects(null); setPlan(null);
        try {
          const system = `너는 학습 코치야. 사용자가 적은 공부 내용에서 과목/활동 단위를 나누고 소요시간(분)을 추정해. 순수 JSON만 출력해. 형식: {"subjects":[{"name":"과목명","minutes":숫자,"note":"설명"}]}`;
          const userContent = `공부: ${studyInput}\n왕초보: ${beginner ? "예" : "아니오"}`;
          const text = await callClaude({ system, userContent, maxTokens: 1000 });
          const parsed = parseJsonLoose(text);
          setParsedSubjects(parsed.subjects.map((s) => ({ id: uid(), name: s.name, minutes: s.minutes, note: s.note || "" })));
        } catch (e) { setAnalyzeError("과목 분석 실패"); } finally { setAnalyzing(false); }
      }

      async function buildSchedule() {
        if (!parsedSubjects) return;
        setBuilding(true); setBuildError("");
        try {
          const listText = parsedSubjects.map((s) => `${s.name}: ${s.minutes}분`).join("\n");
          const system = `너는 학습 스케줄러야. 과목별 시간으로 일정을 짜. 순수 JSON만 출력해. 형식: {"totalMinutes":숫자,"advice":"코멘트","blocks":[{"subject":"과목명","type":"study 또는 break","minutes":숫자}]}`;
          const userContent = `과목목록:\n${listText}\n하루목표: ${dailyHoursTarget}시간\n목표: ${goal || "없음"}`;
          const text = await callClaude({ system, userContent, maxTokens: 900 });
          const parsed = parseJsonLoose(text);
          setPlan(parsed);
          setSubjects(parsedSubjects.map((s, i) => ({ id: uid(), name: s.name, color: ACCENTS[i % ACCENTS.length] })));
        } catch (e) { setBuildError("계획 만들기 실패"); } finally { setBuilding(false); }
      }

      return (
        <div>
          <div className="card">
            <p className="card-title"><Sparkles size={14} /> 지금 하고 있는 공부</p>
            <textarea placeholder="예: 국어 독서 지문 풀이, 미적분 인강 보고 문제풀이..." value={studyInput} onChange={(e) => setStudyInput(e.target.value)} style={{ minHeight: 90 }} />
          </div>
          <div className="card">
            <p className="card-title">추가 목표 (선택)</p>
            <input type="text" placeholder="예: 중간고사 대비" value={goal} onChange={(e) => setGoal(e.target.value)} />
          </div>
          <div className="card">
            <p className="card-title">하루 목표 공부시간</p>
            <input type="number" min="1" max="14" value={dailyHoursTarget} onChange={(e) => setDailyHoursTarget(Number(e.target.value))} />
            <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12, fontSize: 13 }}>
              <input type="checkbox" checked={beginner} onChange={(e) => setBeginner(e.target.checked)} style={{ width: "auto" }} />
              공부 습관이 거의 없는 왕초보예요
            </label>
          </div>
          {analyzeError && <p style={{ color: "var(--coral)", fontSize: 13 }}>{analyzeError}</p>}
          {!parsedSubjects && (
            <button className="btn btn-primary btn-block" onClick={analyzeSubjects} disabled={analyzing}>
              {analyzing ? <Loader2 size={16} className="spin" /> : <Sparkles size={16} />}
              {analyzing ? "분석 중..." : "과목 & 예상 시간 분석하기"}
            </button>
          )}
          {parsedSubjects && (
            <div className="card">
              <p className="card-title">예상 소요시간 확인 및 수정</p>
              {parsedSubjects.map((s) => (
                <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0" }}>
                  <div style={{ flex: 1 }}>{s.name}</div>
                  <input type="number" value={s.minutes} onChange={(e) => {
                    const v = Number(e.target.value);
                    setParsedSubjects(prev => prev.map(p => p.id === s.id ? {...p, minutes: v} : p));
                  }} style={{ width: 65, textAlign: "center" }} />
                  <span style={{ fontSize: 12 }}>분</span>
                </div>
              ))}
              <button className="btn btn-primary btn-block" style={{ marginTop: 12 }} onClick={buildSchedule} disabled={building}>
                {building ? "일정 짜는 중..." : "이 시간으로 계획 만들기"}
              </button>
            </div>
          )}
          {plan && (
            <div className="card" style={{ marginTop: 14 }}>
              <p className="card-title"><CalendarClock size={14} /> 오늘의 학습 계획 ({plan.totalMinutes}분)</p>
              {plan.blocks.map((b, i) => (
                <div className="plan-block" key={i}>
                  <span className="tag" style={{ background: b.type === "break" ? "var(--blue)" : ACCENTS[i % ACCENTS.length] }}>{b.type === "break" ? "휴식" : b.subject}</span>
                  <span style={{ fontSize: 13 }}>{b.minutes}분</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function TimerTab({ subjects, plan, onFinishSession, records }) {
      const planSubjects = plan ? plan.blocks.filter((b) => b.type === "study").map((b) => b.subject) : [];
      const allNames = Array.from(new Set([...(subjects.map((s) => s.name)), ...planSubjects]));
      const [selected, setSelected] = useState(allNames[0] || "");
      const [seconds, setSeconds] = useState(0);
      const [running, setRunning] = useState(false);
      const [targetMinutes, setTargetMinutes] = useState(25);
      const intervalRef = useRef(null);

      useEffect(() => { if (!selected && allNames.length > 0) setSelected(allNames[0]); }, [allNames, selected]);
      useEffect(() => {
        if (running) { intervalRef.current = setInterval(() => setSeconds((s) => s + 1), 1000); }
        else if (intervalRef.current) { clearInterval(intervalRef.current); }
        return () => intervalRef.current && clearInterval(intervalRef.current);
      }, [running]);

      const pct = Math.min(100, (seconds / (targetMinutes * 60)) * 100);
      const radius = 80;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference * (1 - pct / 100);

      function finishAndSave() {
        const minutes = Math.round(seconds / 60);
        if (minutes > 0 && selected) onFinishSession(selected, minutes);
        setRunning(false); setSeconds(0);
      }

      return (
        <div>
          <div className="card">
            <p className="card-title">공부 과목</p>
            <select value={selected} onChange={(e) => setSelected(e.target.value)}>
              {allNames.length === 0 && <option value="">과목을 추가해 주세요</option>}
              {allNames.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            <div style={{ marginTop: 10 }}>
              <p className="card-title">목표 시간 (분)</p>
              <input type="number" min="5" max="180" value={targetMinutes} onChange={(e) => setTargetMinutes(Number(e.target.value))} disabled={running} />
            </div>
          </div>
          <div className="ring-wrap">
            <svg width="190" height="190" viewBox="0 0 190 190">
              <circle cx="95" cy="95" r={radius} fill="none" stroke="var(--surface-light)" strokeWidth="12" />
              <circle cx="95" cy="95" r={radius} fill="none" stroke="var(--amber)" strokeWidth="12" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset} transform="rotate(-90 95 95)" />
              <text x="95" y="90" textAnchor="middle" fontSize="30" fill="var(--ink)" fontFamily="IBM Plex Mono">{formatClock(seconds)}</text>
              <text x="95" y="115" textAnchor="middle" fontSize="12" fill="var(--ink-muted)">목표 {targetMinutes}분</text>
            </svg>
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setRunning((r) => !r)} disabled={!selected}>
              {running ? <Pause size={16} /> : <Play size={16} />} {running ? "일시정지" : "시작"}
            </button>
            <button className="btn btn-secondary" onClick={() => { setRunning(false); setSeconds(0); }}><RotateCcw size={16} /></button>
            <button className="btn btn-secondary" onClick={finishAndSave} disabled={seconds === 0}><CheckCircle2 size={16} /> 저장</button>
          </div>
        </div>
      );
    }

    function PhotoSolveTab() {
      const [preview, setPreview] = useState(null);
      const [fileData, setFileData] = useState(null);
      const [question, setQuestion] = useState("");
      const [answer, setAnswer] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      async function handleFile(e) {
        const file = e.target.files[0]; if (!file) return;
        setPreview(URL.createObjectURL(file)); setAnswer("");
        try { const base64 = await fileToBase64(file); setFileData({ base64, mediaType: file.type }); }
        catch (err) { setError("이미지 로드 실패"); }
      }

      async function solve() {
        if (!fileData) { setError("먼저 문제 사진을 올려 주세요."); return; }
        setLoading(true); setError(""); setAnswer("");
        try {
          const system = "너는 친절한 선생님이야. 사진 속 문제를 풀어서 학생에게 설명해줘.";
          const userContent = [
            { type: "image", source: { type: "base64", media_type: fileData.mediaType, data: fileData.base64 } },
            { type: "text", text: question.trim() ? `추가 질문: ${question}` : "이 문제를 풀어서 설명해줘." },
          ];
          const text = await callClaude({ system, userContent, maxTokens: 1000 });
          setAnswer(text);
        } catch (e) { setError("풀이를 가져오지 못했어요."); } finally { setLoading(false); }
      }

      return (
        <div>
          <div className="card">
            <p className="card-title"><Camera size={14} /> 모르는 문제 사진 올리기</p>
            <label className="photo-upload">
              <Upload size={20} style={{ marginBottom: 6 }} />
              <div>탭해서 사진 선택</div>
              <input type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
            </label>
            {preview && <img src={preview} alt="문제" className="preview" />}
            <textarea placeholder="궁금한 점을 적어주세요 (선택)" value={question} onChange={(e) => setQuestion(e.target.value)} style={{ marginTop: 10 }} />
          </div>
          {error && <p style={{ color: "var(--coral)", fontSize: 13 }}>{error}</p>}
          <button className="btn btn-primary btn-block" onClick={solve} disabled={loading}>
            {loading ? <Loader2 size={16} className="spin" /> : <Sparkles size={16} />}
            {loading ? "풀이 중..." : "풀이 요청하기"}
          </button>
          {answer && <div className="card" style={{ marginTop: 14, whiteSpace: "pre-wrap", fontSize: 14 }}>{answer}</div>}
        </div>
      );
    }

    function QuizTab({ quizSets, setQuizSets }) {
      const [preview, setPreview] = useState(null);
      const [fileData, setFileData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [activeQuizId, setActiveQuizId] = useState(null);
      const [answers, setAnswers] = useState({});

      async function handleFile(e) {
        const file = e.target.files[0]; if (!file) return;
        setPreview(URL.createObjectURL(file));
        try { const base64 = await fileToBase64(file); setFileData({ base64, mediaType: file.type }); }
        catch (err) { setError("이미지 로드 실패"); }
      }

      async function makeQuiz() {
        if (!fileData) { setError("먼저 책 페이지 사진을 올려 주세요."); return; }
        setLoading(true); setError("");
        try {
          const system = `너는 퀴즈 출제자야. 사진 속 내용으로 4지선다 퀴즈 4문제를 만들어. 순수 JSON만 출력해. 형식: {"title":"제목","questions":[{"question":"문제","options":["1","2","3","4"],"answerIndex":0,"explanation":"해설"}]}`;
          const userContent = [
            { type: "image", source: { type: "base64", media_type: fileData.mediaType, data: fileData.base64 } },
            { type: "text", text: "퀴즈를 만들어줘." }
          ];
          const text = await callClaude({ system, userContent, maxTokens: 1000 });
          const parsed = parseJsonLoose(text);
          const newQuiz = { id: uid(), title: parsed.title, questions: parsed.questions, date: todayStr() };
          setQuizSets((prev) => [newQuiz, ...prev]);
          setActiveQuizId(newQuiz.id);
          setAnswers({}); setPreview(null); setFileData(null);
        } catch (e) { setError("퀴즈 제작 실패"); } finally { setLoading(false); }
      }

      const activeQuiz = quizSets.find((q) => q.id === activeQuizId);

      if (activeQuiz) {
        return (
          <div>
            <button className="btn btn-ghost" style={{ marginBottom: 12 }} onClick={() => setActiveQuizId(null)}>← 목록으로</button>
            <div className="card">
              <p className="card-title display-font" style={{ fontSize: 16 }}>{activeQuiz.title}</p>
              {activeQuiz.questions.map((q, qi) => (
                <div key={qi} style={{ marginBottom: 18 }}>
                  <p style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>{qi + 1}. {q.question}</p>
                  {q.options.map((opt, oi) => {
                    const chosen = answers[qi];
                    let cls = "quiz-option";
                    if (chosen !== undefined) {
                      if (oi === q.answerIndex) cls += " correct";
                      else if (oi === chosen) cls += " wrong";
                    }
                    return (
                      <button key={oi} className={cls} onClick={() => setAnswers({...answers, [qi]: oi})} disabled={chosen !== undefined}>
                        {opt}
                      </button>
                    );
                  })}
                  {answers[qi] !== undefined && <p style={{ fontSize: 13, color: "var(--ink-muted)" }}>{q.explanation}</p>}
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="card">
            <p className="card-title"><Camera size={14} /> 책 페이지 사진으로 퀴즈 만들기</p>
            <label className="photo-upload">
              <Upload size={20} style={{ marginBottom: 6 }} />
              <div>탭해서 사진 선택</div>
              <input type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
            </label>
            {preview && <img src={preview} alt="책" className="preview" />}
          </div>
          {error && <p style={{ color: "var(--coral)", fontSize: 13 }}>{error}</p>}
          <button className="btn btn-primary btn-block" onClick={makeQuiz} disabled={loading}>
            {loading ? <Loader2 size={16} className="spin" /> : <BrainCircuit size={16} />}
            {loading ? "퀴즈 만드는 중..." : "퀴즈 생성"}
          </button>
          <div className="card" style={{ marginTop: 14 }}>
            <p className="card-title">만든 퀴즈 목록</p>
            {quizSets.length === 0 && <p className="empty">아직 만든 퀴즈가 없어요.</p>}
            {quizSets.map((q) => (
              <div className="plan-block" key={q.id}>
                <span style={{ cursor: "pointer" }} onClick={() => { setActiveQuizId(q.id); setAnswers({}); }}>{q.title}</span>
                <Trash2 size={14} style={{ cursor: "pointer", color: "var(--ink-muted)" }} onClick={() => setQuizSets(prev => prev.filter(x => x.id !== q.id))} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BookRecommendTab({ bookRecs, setBookRecs }) {
      const [subject, setSubject] = useState("");
      const [level, setLevel] = useState("완전 초보");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      async function recommend() {
        if (!subject.trim()) { setError("배우고 싶은 과목을 입력해 주세요."); return; }
        setLoading(true); setError("");
        try {
          const system = `너는 독서 큐레이터야. 책 3~5권을 추천해. 순수 JSON만 출력해. 형식: {"books":[{"title":"제목","author":"저자","level":"수준","reason":"이유"}]}`;
          const userContent = `분야: ${subject}\n수준: ${level}`;
          const text = await callClaude({ system, userContent, maxTokens: 900 });
          const parsed = parseJsonLoose(text);
          const newRec = { id: uid(), subject, level, books: parsed.books, date: todayStr() };
          setBookRecs((prev) => [newRec, ...prev]);
        } catch (e) { setError("추천 받기 실패"); } finally { setLoading(false); }
      }

      return (
        <div>
          <div className="card">
            <p className="card-title"><BookOpen size={14} /> 배우고 싶은 분야</p>
            <input type="text" placeholder="예: 파이썬, 영어 회화..." value={subject} onChange={(e) => setSubject(e.target.value)} />
          </div>
          <div className="card">
            <p className="card-title">현재 실력</p>
            <select value={level} onChange={(e) => setLevel(e.target.value)}>
              <option>완전 초보</option><option>기초는 있음</option><option>중급</option><option>고급</option>
            </select>
          </div>
          {error && <p style={{ color: "var(--coral)", fontSize: 13 }}>{error}</p>}
          <button className="btn btn-primary btn-block" onClick={recommend} disabled={loading}>
            {loading ? <Loader2 size={16} className="spin" /> : <Sparkles size={16} />}
            {loading ? "추천 받는 중..." : "책 추천받기"}
          </button>
          <div className="card" style={{ marginTop: 14 }}>
            <p className="card-title">지난 추천 목록</p>
            {bookRecs.length === 0 && <p className="empty">아직 받은 책 추천이 없어요.</p>}
            {bookRecs.map((r) => (
              <div className="plan-block" key={r.id}>
                <span>{r.subject} ({r.level})</span>
                <Trash2 size={14} style={{ cursor: "pointer", color: "var(--ink-muted)" }} onClick={() => setBookRecs(prev => prev.filter(x => x.id !== r.id))} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudyApp />);
  </script>
</body>
</html>
